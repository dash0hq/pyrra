# These tests load the rules generated by TestThresholdPromtool.
tests:
  - name: good minute, quiet minute, slow minute
    interval: 15s
    input_series:
      - series: 'request_duration_seconds_bucket{job="checkout",instance="a",route="checkout",le="0.4"}'
        values: '0 10 20 30 40 40 40 40 40 40 40 40 40'
      - series: 'request_duration_seconds_bucket{job="checkout",instance="a",route="checkout",le="1"}'
        values: '0 10 20 30 40 40 40 40 40 50 60 70 80'
      - series: 'request_duration_seconds_bucket{job="checkout",instance="a",route="checkout",le="+Inf"}'
        values: '0 10 20 30 40 40 40 40 40 50 60 70 80'
      # A second group is always healthy. Its traffic must not make the quiet
      # checkout minute count, nor mask checkout's slow third minute.
      - series: 'request_duration_seconds_bucket{job="checkout",instance="b",route="health",le="0.4"}'
        values: '0+10x12'
      - series: 'request_duration_seconds_bucket{job="checkout",instance="b",route="health",le="1"}'
        values: '0+10x12'
      - series: 'request_duration_seconds_bucket{job="checkout",instance="b",route="health",le="+Inf"}'
        values: '0+10x12'
      # The fixed recording name is shared. Accounting must select this SLO.
      - series: 'pyrra_threshold{slo="another-slo",job="checkout",route="checkout"}'
        values: '1+0x12'
    promql_expr_test:
      - expr: 'pyrra_threshold{slo="checkout-latency",route="checkout"}'
        eval_time: 1m
        exp_samples:
          - labels: 'pyrra_threshold{slo="checkout-latency",job="checkout",route="checkout"}'
            value: 1
      - expr: 'pyrra_threshold{slo="checkout-latency",route="checkout"}'
        eval_time: 2m
        exp_samples: []
      - expr: 'pyrra_threshold{slo="checkout-latency",route="checkout"}'
        eval_time: 3m
        exp_samples:
          - labels: 'pyrra_threshold{slo="checkout-latency",job="checkout",route="checkout"}'
            value: 0
      - expr: 'count_over_time(pyrra_threshold{slo="checkout-latency"}[3m])'
        eval_time: 3m
        exp_samples:
          - labels: '{slo="checkout-latency",job="checkout",route="checkout"}'
            value: 2
          - labels: '{slo="checkout-latency",job="checkout",route="health"}'
            value: 3
      - expr: 'sum_over_time(pyrra_threshold{slo="checkout-latency"}[3m])'
        eval_time: 3m
        exp_samples:
          - labels: '{slo="checkout-latency",job="checkout",route="checkout"}'
            value: 1
          - labels: '{slo="checkout-latency",job="checkout",route="health"}'
            value: 3
      - expr: 'pyrra_threshold:burnrate5m{slo="checkout-latency"}'
        eval_time: 3m
        exp_samples:
          - labels: 'pyrra_threshold:burnrate5m{slo="checkout-latency",job="checkout",route="checkout"}'
            value: 0.5
          - labels: 'pyrra_threshold:burnrate5m{slo="checkout-latency",job="checkout",route="health"}'
            value: 0
      - expr: 'pyrra_threshold:count4w{slo="checkout-latency"}'
        eval_time: 3m
        exp_samples:
          - labels: 'pyrra_threshold:count4w{slo="checkout-latency",job="checkout",route="checkout"}'
            value: 2
          - labels: 'pyrra_threshold:count4w{slo="checkout-latency",job="checkout",route="health"}'
            value: 3
      - expr: 'pyrra_threshold:sum4w{slo="checkout-latency"}'
        eval_time: 3m
        exp_samples:
          - labels: 'pyrra_threshold:sum4w{slo="checkout-latency",job="checkout",route="checkout"}'
            value: 1
          - labels: 'pyrra_threshold:sum4w{slo="checkout-latency",job="checkout",route="health"}'
            value: 3
